<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobile Clarity · Start</title>
<meta name="description" content="Design mockup (mobile-clarity): start screen. Params: ?lang=en|zh&save=0|1">
<link rel="stylesheet" href="mockup-mobile-clarity-assets/mc.css">
<style>
  body { overflow: auto; }
  .start { min-height: 100vh; min-height: 100dvh; position: relative; overflow: hidden;
    background: radial-gradient(900px 600px at 12% 0%, rgba(39, 98, 196, .30), transparent 60%),
                radial-gradient(900px 600px at 100% 100%, rgba(207, 42, 54, .26), transparent 60%), var(--ink-950); }
  .start-map { position: absolute; inset: 0; opacity: .10; pointer-events: none; }
  .start-in { position: relative; max-width: 1180px; margin: 0 auto; padding: 22px 28px 26px; display: grid; grid-template-columns: 1.05fr 1fr; gap: 26px 48px; min-height: 100vh; min-height: 100dvh; grid-template-rows: auto 1fr auto; }
  .s-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  .s-top .brand-mark { width: 34px; height: 34px; }
  .s-top .sp { flex: 1; }
  .hero { align-self: center; }
  .hero h1 { margin: 0; font: 900 76px/.9 var(--font-cond); font-stretch: var(--stretch-cond); letter-spacing: .01em; text-transform: uppercase; }
  .hero h1 span { display: block; color: var(--ink-300); font-size: 30px; letter-spacing: .14em; margin-top: 10px; font-weight: 700; }
  :lang(zh-CN) .hero h1 span { letter-spacing: .3em; font-size: 34px; }
  .hero p { font-size: 17px; line-height: 1.55; color: var(--ink-200); max-width: 34em; margin: 22px 0 0; }
  .ai-card { margin-top: 26px; display: grid; grid-template-columns: 46px 1fr; gap: 4px 14px; padding: 16px; border-radius: 18px; background: rgba(24, 38, 61, .75); border: 1px solid var(--ink-700); max-width: 520px; }
  .ai-card .av { grid-row: 1 / 3; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(135deg, var(--us-700) 0 50%, var(--ussr-600) 50%); }
  .ai-card .av svg { width: 26px; height: 26px; color: #fff; }
  .ai-card b { font-size: 15px; }
  .ai-card small { color: var(--ink-300); font-size: 13px; line-height: 1.45; }
  .load { grid-column: 1 / -1; margin-top: 10px; }
  .load-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-300); margin-bottom: 6px; }
  .bar { height: 8px; border-radius: 4px; background: var(--ink-700); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 62%; border-radius: inherit; background: linear-gradient(90deg, var(--act-600), var(--act-400)); }
  .steps { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--ink-400); flex-wrap: wrap; }
  .steps span { display: inline-flex; align-items: center; gap: 5px; }
  .steps .ok { color: var(--ok-500); }
  .steps svg { width: 14px; height: 14px; }

  .play { align-self: center; display: flex; flex-direction: column; gap: 14px; }
  .resume { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 16px; padding: 16px 18px; border-radius: 20px; background: var(--ink-800); border: 1px solid var(--ink-600); }
  .resume .eyebrow { grid-column: 1 / -1; }
  .resume .what { font-size: 17px; font-weight: 750; }
  .resume .what small { display: block; font-size: 13px; color: var(--ink-300); font-weight: 500; margin-top: 3px; }
  .resume .btn { min-width: 150px; }
  .h-choose { display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px; }
  .h-choose h2 { margin: 0; font-size: 20px; }
  .h-choose small { color: var(--ink-400); font-size: 12.5px; }
  .side { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 14px; padding: 16px 16px 16px 14px; border-radius: 20px; border: 0; text-align: left; cursor: pointer; color: #fff; min-height: 92px; box-shadow: var(--shadow-2); position: relative; overflow: hidden; }
  .side .g { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 2px rgba(255,255,255,.28); }
  .side .g svg { width: 32px; height: 32px; }
  .side b { font: 900 25px/1 var(--font-cond); font-stretch: var(--stretch-cond); letter-spacing: .03em; text-transform: uppercase; }
  .side ul { margin: 7px 0 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.45; color: rgba(255,255,255,.86); }
  .side ul li::before { content: "· "; }
  .side .go { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18); }
  .side .go svg { width: 20px; height: 20px; }
  .side.ussr { background: linear-gradient(120deg, var(--ussr-600), var(--ussr-900)); }
  .side.us { background: linear-gradient(120deg, var(--us-600), var(--us-900)); }
  .side.rnd { background: linear-gradient(120deg, var(--us-700) 0 49.5%, var(--ussr-700) 50.5%); min-height: 74px; }
  .side.rnd .g svg { width: 30px; height: 30px; }
  .note { font-size: 12.5px; color: var(--ink-400); display: flex; gap: 8px; align-items: flex-start; }
  .note svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }

  .s-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; font-size: 12.5px; color: var(--ink-400); border-top: 1px solid var(--ink-800); padding-top: 14px; }
  .s-foot a { color: var(--ink-200); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 650; }
  .s-foot a svg { width: 16px; height: 16px; }
  .s-foot .legal { flex: 1 1 380px; text-align: right; }

  @media (max-width: 899px) {
    .start-in { grid-template-columns: 100%; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); gap: 16px; grid-template-rows: auto auto auto auto; }
    .hero h1 { font-size: 36px; }
    .hero h1 span { font-size: 15px; margin-top: 5px; }
    .hero p { display: none; }
    .h-choose { flex-direction: column; gap: 2px; margin-top: 2px; }
    .h-choose h2 { font-size: 17px; }
    .side ul li:nth-child(2) { display: none; }
    .resume .what small { font-size: 12px; }
    .s-top { margin-bottom: -4px; }
    .hero .ai-card { display: none; }
    .play { gap: 10px; }
    .side { min-height: 78px; padding: 12px; grid-template-columns: 48px 1fr auto; gap: 12px; }
    .side .g { width: 48px; height: 48px; border-radius: 13px; }
    .side .g svg { width: 26px; height: 26px; }
    .side b { font-size: 21px; }
    .side ul { font-size: 12.5px; margin-top: 4px; }
    .side.rnd { min-height: 62px; }
    .resume { padding: 12px 14px; }
    .resume .what { font-size: 15px; }
    .resume .btn { min-width: 0; grid-column: 1 / -1; }
    .s-top .seg button { padding: 6px 10px; }
    .s-foot .legal { text-align: left; }
    .ai-mobile { display: grid !important; }
  }
  .ai-mobile { display: none; }
</style>
</head>
<body>
<div id="start"></div>
<script src="mockup-mobile-clarity-assets/mc-data.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const LANG = Q.get("lang") === "zh" ? "zh" : "en";
  const SAVE = Q.get("save") !== "0";
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  const L = (en, zh) => (LANG === "zh" ? zh : en);
  const sym = `<svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="g-us" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2l2.7 6.3 6.8.6-5.2 4.5 1.6 6.7L12 16.7l-5.9 3.6 1.6-6.7-5.2-4.5 6.8-.6z"/></symbol>
    <symbol id="g-ussr" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M7.1 16.1A7.1 7.1 0 1 0 9 4.6" stroke-width="2.5"/><path d="M7.1 16.1 3.6 19.8" stroke-width="3.2"/><path d="M9.6 9.6 19.4 19.4" stroke-width="2.7"/></g><path fill="currentColor" d="M10.2 4.4 13 7.2 7.2 13 4.4 10.2z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5" stroke-linecap="round"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v6M12 7.2v.1" stroke-linecap="round"/></g></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3" stroke-linecap="round"/></g></symbol>
  </defs></svg>`;
  const ico = (id, st = "") => `<svg style="${st}" aria-hidden="true"><use href="#${id}"/></svg>`;
  // faint world: country dots coloured by region
  const RC = ["#b9a7de", "#f5a54c", "#a8dcf1", "#f5e6a6", "#d9e59e", "#abd597"];
  const dots = window.MC_COUNTRIES.map((c) => `<rect x="${c.x - 46}" y="${c.y - 30}" width="92" height="60" rx="8" fill="${c.sea ? "#f8cf52" : RC[c.r]}"/>`).join("");
  const ai = `<div class="av">${ico("i-chip")}</div><b>${L("Opponent: DeepStruggle AI", "对手：DeepStruggle AI")}</b>
      <small>${L("The top-rated network on the DeepStruggle leaderboard, always at full strength — no difficulty levels. It runs on your device and thinks for a few seconds per move.", "DeepStruggle 排行榜第一名的模型，始终全力以赴，没有难度分级。它在你的设备上运行，每步思考数秒。")}</small>
      <div class="load"><div class="load-row"><span>${L("Getting the AI ready · first visit only", "正在准备 AI · 仅首次访问")}</span><span>3.6 / 5.8 MB</span></div><div class="bar"><i></i></div>
      <div class="steps"><span class="ok">${ico("i-check")}${L("Rules engine", "规则引擎")}</span><span>${L("AI model 62%", "AI 模型 62%")}</span><span>${L("Verify", "校验")}</span><span>${L("Start AI", "启动 AI")}</span></div></div>`;
  document.getElementById("start").innerHTML = sym + `<div class="start">
    <svg class="start-map" viewBox="40 60 2380 1400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${dots}</svg>
    <div class="start-in">
      <div class="s-top">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="bm"><circle cx="16" cy="16" r="14"/></clipPath></defs><g clip-path="url(#bm)"><rect width="16" height="32" fill="var(--us-600)"/><rect x="16" width="16" height="32" fill="var(--ussr-600)"/><path d="M2 16h28M16 2c-5 4-5 24 0 28M16 2c5 4 5 24 0 28M4 9h24M4 23h24" stroke="rgba(255,255,255,.55)" stroke-width="1.3" fill="none"/></g><circle cx="16" cy="16" r="14" fill="none" stroke="#fff" stroke-width="2"/></svg>
        <span class="eyebrow">Playfield</span><span class="sp"></span>
        <div class="seg" role="group" aria-label="Language"><button aria-pressed="${LANG === "en"}">EN</button><button aria-pressed="${LANG === "zh"}">中文</button></div>
        <button class="icon-btn" aria-label="${L("Settings", "设置")}">${ico("i-gear")}</button>
      </div>
      <section class="hero">
        <h1>Twilight Struggle<span>${L("vs. DeepStruggle AI", "冷战热斗 · 人机对战")}</span></h1>
        <p>${L("The Cold War, 1945–1989, against the strongest Twilight Struggle AI. Standard game with the optional cards, +2 US bid, tournament rules. Free, in your browser.", "1945–1989 年的冷战，对阵最强的冷战热斗 AI。标准游戏含可选卡牌、美国 +2 竞价、锦标赛规则。免费，直接在浏览器中进行。")}</p>
        <div class="ai-card">${ai}</div>
      </section>
      <section class="play" aria-label="${L("Play", "开始")}">
        ${SAVE ? `<div class="resume"><span class="eyebrow">${L("Game in progress", "进行中的对局")}</span>
          <div class="what">${L("Turn 4 · Action round 3 · you are the US", "第 4 回合 · 行动轮 3 · 你是美国")}<small>${L("VP US +3 · DEFCON 3 · saved on this device 2 h ago", "VP 美国 +3 · DEFCON 3 · 2 小时前保存在本设备")}</small></div>
          <button class="btn primary big">${L("Continue", "继续")}</button></div>` : ""}
        <div class="h-choose"><h2>${L("New game — choose your side", "新对局——选择阵营")}</h2>${SAVE ? `<small>${L("replaces the saved game", "将覆盖已保存的对局")}</small>` : ""}</div>
        <button class="side ussr"><span class="g">${ico("g-ussr", "color:#fff")}</span><span><b>${L("Play the USSR", "执苏联")}</b><ul><li>${L("Moves first; starts with the China Card", "先手；开局持有中国牌")}</li><li>${L("Sets up 6 influence in Eastern Europe", "在东欧布置 6 点影响力")}</li></ul></span><span class="go">${ico("i-chev")}</span></button>
        <button class="side us"><span class="g">${ico("g-us", "color:#fff")}</span><span><b>${L("Play the US", "执美国")}</b><ul><li>${L("Sets up 7 in Western Europe, then +2 bid", "在西欧布置 7 点，再加 2 点竞价")}</li><li>${L("Wins headline ties", "头条平局时先结算")}</li></ul></span><span class="go">${ico("i-chev")}</span></button>
        <button class="side rnd"><span class="g">${ico("i-dice", "color:#fff")}</span><span><b>${L("Random side", "随机阵营")}</b></span><span class="go">${ico("i-chev")}</span></button>
        <div class="ai-card ai-mobile">${ai}</div>
        <div class="note">${ico("i-info")}<span>${L("New to the game? Read the official rules first — the site teaches the interface, not the rules.", "第一次玩？请先阅读官方规则——本站讲解界面，不讲解规则。")}</span></div>
      </section>
      <footer class="s-foot">
        <a href="https://www.gmtgames.com/living_rules/TS_Rules_Deluxe.pdf">${ico("i-book")}${L("Official rules (GMT, PDF)", "官方规则（GMT，PDF）")}</a>
        <a href="#">${L("Credits & licences", "致谢与许可")}</a>
        <span class="legal">${L("Rules engine & AI: DeepStruggle by Mikhail Dektyarev (MIT). Twilight Struggle is © GMT Games; unofficial fan project.", "规则引擎与 AI：DeepStruggle，作者 Mikhail Dektyarev（MIT 许可）。冷战热斗版权归 GMT Games 所有；非官方爱好者项目。")}</span>
      </footer>
    </div></div>`;
})();
</script>
</body>
</html>
